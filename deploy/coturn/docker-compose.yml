# coturn: the TURN relay for live help and the softphone (Admin -> Telephony -> Own TURN server).
# Copy turnserver.conf.example to turnserver.conf and fill it in first. See README.md here.
services:
  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    # host networking: Docker's port mapping copes badly with the UDP relay range
    network_mode: host
    # only our file: the image's default command adds its own --external-ip, which clashes with it
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
      # the certificate for the TURN host name, for turns: (TLS, port 5349)
      - /etc/letsencrypt:/etc/letsencrypt:ro
